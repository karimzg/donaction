name: 'SSH Setup'
description: 'Setup SSH connection for deployment'

inputs:
  ssh-private-key:
    description: 'SSH private key'
    required: true
  ssh-host:
    description: 'SSH host'
    required: true
  ssh-user:
    description: 'SSH user'
    required: true
  ssh-port:
    description: 'SSH port'
    required: false
    default: '63009'
  ssh-known-host-key:
    description: 'Known host public key (e.g. from ssh-keyscan). If provided, skips ssh-keyscan to prevent MITM attacks.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup SSH
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_KNOWN_HOST_KEY: ${{ inputs.ssh-known-host-key }}
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_PORT: ${{ inputs.ssh-port }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

        if [[ -n "$SSH_KNOWN_HOST_KEY" ]]; then
          echo "$SSH_KNOWN_HOST_KEY" >> ~/.ssh/known_hosts
        else
          echo "::warning::ssh-known-host-key not provided — falling back to ssh-keyscan (MITM risk on first connect)"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
        fi

    - name: Validate SSH connection
      shell: bash
      env:
        SSH_PORT: ${{ inputs.ssh-port }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_HOST: ${{ inputs.ssh-host }}
      run: |
        if ! ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa -o ConnectTimeout=10 "${SSH_USER}@${SSH_HOST}" "echo 'SSH connection successful'"; then
          echo "::error::SSH connection failed"
          exit 1
        fi
